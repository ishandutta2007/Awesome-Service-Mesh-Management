<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080C14"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E1035"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="50%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#A855F7"/></linearGradient><linearGradient id="glowLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/><stop offset="50%" stop-color="#38BDF8" stop-opacity=".8"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/></linearGradient><filter id="textGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".7" stdDeviation="8"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1E293B" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.3);opacity:.9}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes glowPulse{0%{opacity:.3}50%{opacity:.8}}.bg-grid{fill:url(#grid)}.flow-line{stroke:url(#cyanPurple);stroke-width:2;stroke-dasharray:10 10;animation:dash 3s linear infinite}.node-pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center}.floating-mesh{animation:floatNode 4s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.badge-pill{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-size:12px;font-weight:600;fill:#38bdf8}</style><rect width="1200" height="320" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="320" class="bg-grid" rx="16"/><g class="floating-mesh" opacity=".45"><path fill="none" d="M 50 60 Q 300 20 600 70 T 1150 40" class="flow-line"/><path fill="none" d="M 80 270 Q 400 310 750 250 T 1120 280" class="flow-line" style="animation-duration:5s"/><line x1="150" x2="280" y1="70" y2="130" stroke="#38BDF8" stroke-opacity=".3" stroke-width="1.5"/><line x1="280" x2="220" y1="130" y2="240" stroke="#818CF8" stroke-opacity=".3" stroke-width="1.5"/><line x1="920" x2="1040" y1="80" y2="160" stroke="#A855F7" stroke-opacity=".3" stroke-width="1.5"/><line x1="1040" x2="960" y1="160" y2="260" stroke="#06B6D4" stroke-opacity=".3" stroke-width="1.5"/><circle cx="150" cy="70" r="14" fill="#06B6D4" class="node-pulse"/><circle cx="150" cy="70" r="6" fill="#E0F2FE"/><circle cx="280" cy="130" r="16" fill="#3B82F6" class="node-pulse" style="animation-delay:1s"/><circle cx="280" cy="130" r="7" fill="#FFF"/><circle cx="220" cy="240" r="12" fill="#818CF8" class="node-pulse" style="animation-delay:2s"/><circle cx="220" cy="240" r="5" fill="#EEF2FF"/><circle cx="920" cy="80" r="15" fill="#A855F7" class="node-pulse" style="animation-delay:1.5s"/><circle cx="920" cy="80" r="6" fill="#FAF5FF"/><circle cx="1040" cy="160" r="18" fill="#06B6D4" stroke="#38BDF8" stroke-width="2" class="node-pulse" style="animation-delay:.5s"/><circle cx="1040" cy="160" r="8" fill="#FFF"/><circle cx="960" cy="260" r="12" fill="#EC4899" class="node-pulse" style="animation-delay:2.5s"/><circle cx="960" cy="260" r="5" fill="#FDF2F8"/></g><ellipse cx="600" cy="160" fill="#3B82F6" filter="url(#textGlow)" opacity=".12" rx="380" ry="90"/><g filter="url(#shadow)"><g transform="translate(600, 75)"><rect width="280" height="32" x="-140" y="-16" fill="#1E293B" stroke="#38BDF8" stroke-opacity=".6" stroke-width="1" rx="16"/><text x="0" y="5" class="badge-pill" text-anchor="middle">🌐 CLOUD-NATIVE &amp; KUBERNETES</text></g><text x="600" y="152" class="title-text" text-anchor="middle">Awesome Service Mesh Management</text><text x="600" y="198" class="subtitle-text" text-anchor="middle">Curated SaaS Platforms &amp; Open-Source Tools for Microservices, mTLS &amp; Traffic Engineering</text><g><g transform="translate(600, 248) translate(-250, 0)"><rect width="170" height="28" x="-85" y="-14" fill="#0F172A" stroke="#06B6D4" stroke-width="1" rx="14"/><text x="0" y="4" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 mTLS &amp; Zero Trust</text></g><g transform="translate(600, 248) translate(-80, 0)"><rect width="150" height="28" x="-75" y="-14" fill="#0F172A" stroke="#818CF8" stroke-width="1" rx="14"/><text x="0" y="4" fill="#A5B4FC" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔀 Traffic Routing</text></g><g transform="translate(600, 248) translate(85, 0)"><rect width="150" height="28" x="-75" y="-14" fill="#0F172A" stroke="#A855F7" stroke-width="1" rx="14"/><text x="0" y="4" fill="#C084FC" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Observability</text></g><g transform="translate(600, 248) translate(255, 0)"><rect width="170" height="28" x="-85" y="-14" fill="#0F172A" stroke="#EC4899" stroke-width="1" rx="14"/><text x="0" y="4" fill="#F472B6" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ eBPF &amp; Sidecarless</text></g></g></g></svg>